<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWC RI VN Dashboard</title><meta name="robots" content="noindex,nofollow">
<style>:root{--bg:#f3f5f6;--card:#fff;--ink:#1d2a30;--muted:#5d6b72;--line:#d9e0e3;--accent:#0b6e75;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#12181b;--card:#1b2327;--ink:#e6edf0;--muted:#9aa8ae;--line:#2c373c;--accent:#4fc1c9;--bad:#ff8a80}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;box-sizing:border-box}
h1{font-size:1.3rem;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted);font-size:.9rem}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin:12px 0 16px}
button{width:100%;font:600 1rem system-ui,sans-serif;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.play{background:#fef3c7;color:#78350f;border:1px solid #f59e0b;border-radius:8px;padding:8px 10px;font-size:.85rem;margin:0 0 16px}.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:10px 0 0}</style></head><body>
